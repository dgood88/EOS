<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Every Other Saturday</title>
  <meta name="theme-color" content="#060E20" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Chelsea matchday tracker" />

  <!-- Web app manifest (Android / Chrome) -->
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- iOS: make "Add to Home Screen" open full-screen with a proper icon -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Every Other Saturday" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./app.css" />

  <style>
    html,body{margin:0;padding:0;background:#060E20;-webkit-tap-highlight-color:transparent;}
    /* respect the iPhone notch/home-bar when installed */
    #root{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./app.js"></script>
</body>
</html>
